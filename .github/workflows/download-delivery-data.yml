name: Download NSE delivery data

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Rebuild the rolling release even when no new CSV was downloaded
        required: false
        default: false
        type: boolean

  schedule:
    # GitHub Actions cron uses UTC.

    # Runs at 16:07 and 17:07 IST.
    # Minute 07 avoids the busiest top-of-hour scheduling window.
    - cron: "37 10,11 * * 1-5"

    # Runs at 15:37 and 16:37 IST.
    # 10:07 and 11:07 UTC respectively.
    # - cron: "7 10,11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-delivery-data-download
  cancel-in-progress: false

env:
  RELEASE_TAG: nse-delivery-latest
  RELEASE_TITLE: Latest NSE Delivery Data
  RELEASE_ZIP: Day_Delivery.zip
  RELEASE_NOTES: RELEASE_NOTES.md
  RELEASE_LICENSE: LICENSE
  RELEASE_TEMPLATE: .github/release-notes/latest.md

jobs:
  download-commit-and-release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # Download missing NSE delivery files
      # ---------------------------------------------------------------
      - name: Download missing delivery data
        shell: cmd
        run: call delivery_data_downloader.bat

      # ---------------------------------------------------------------
      # Commit and push newly downloaded CSV files
      # ---------------------------------------------------------------
      - name: Commit and push newly downloaded CSV files
        id: commit_data
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "Day_Delivery/NSE/*.csv"

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
              Write-Host "No new delivery CSV files were downloaded."

              $currentSha = (git rev-parse HEAD).Trim()

              "has_changes=false" >> $env:GITHUB_OUTPUT
              "commit_sha=$currentSha" >> $env:GITHUB_OUTPUT
              "file_count=0" >> $env:GITHUB_OUTPUT

              $downloadedFilesPath = Join-Path $env:RUNNER_TEMP "downloaded-files.txt"
              Set-Content -Path $downloadedFilesPath -Value @() -Encoding utf8

              exit 0
          }

          $downloadedFiles = @(
              git diff `
                  --cached `
                  --name-only `
                  --diff-filter=A |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          if ($downloadedFiles.Count -eq 0) {
              Write-Host "No newly added delivery CSV files were detected."

              git reset

              $currentSha = (git rev-parse HEAD).Trim()

              "has_changes=false" >> $env:GITHUB_OUTPUT
              "commit_sha=$currentSha" >> $env:GITHUB_OUTPUT
              "file_count=0" >> $env:GITHUB_OUTPUT

              $downloadedFilesPath = Join-Path $env:RUNNER_TEMP "downloaded-files.txt"
              Set-Content -Path $downloadedFilesPath -Value @() -Encoding utf8

              exit 0
          }

          Write-Host "New delivery files:"

          $downloadedFiles |
              ForEach-Object {
                  Write-Host " - $_"
              }

          $downloadedFilesPath = Join-Path `
              $env:RUNNER_TEMP `
              "downloaded-files.txt"

          $downloadedFiles |
              Set-Content `
                  -Path $downloadedFilesPath `
                  -Encoding utf8

          $commitMessage = (
              "data: add " +
              $downloadedFiles.Count +
              " NSE delivery file(s)"
          )

          git commit `
              -m $commitMessage

          if ($LASTEXITCODE -ne 0) {
              throw "Creating the delivery-data commit failed."
          }

          git push `
              origin `
              "HEAD:$env:DEFAULT_BRANCH"

          if ($LASTEXITCODE -ne 0) {
              throw "Pushing the delivery-data commit failed."
          }

          $commitSha = (
              git rev-parse HEAD
          ).Trim()

          "has_changes=true" >> $env:GITHUB_OUTPUT
          "commit_sha=$commitSha" >> $env:GITHUB_OUTPUT
          "file_count=$($downloadedFiles.Count)" >> $env:GITHUB_OUTPUT

          Write-Host "Committed and pushed new delivery data."
          Write-Host "Commit: $commitSha"

      # ---------------------------------------------------------------
      # Decide whether a rolling release should be published
      # ---------------------------------------------------------------
      - name: Determine rolling release action
        id: release_decision
        shell: pwsh
        env:
          HAS_CHANGES: ${{ steps.commit_data.outputs.has_changes }}
          FORCE_RELEASE: ${{ inputs.force_release || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ steps.commit_data.outputs.commit_sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $hasChanges = $env:HAS_CHANGES -eq "true"
          $forceRelease = (
              $env:EVENT_NAME -eq "workflow_dispatch" -and
              $env:FORCE_RELEASE -eq "true"
          )

          if ($hasChanges) {
              Write-Host "New delivery data was committed; publishing the rolling release."
              "publish_release=true" >> $env:GITHUB_OUTPUT
              "release_mode=new-data" >> $env:GITHUB_OUTPUT
          }
          elseif ($forceRelease) {
              Write-Host "Forced rolling-release rebuild requested."
              "publish_release=true" >> $env:GITHUB_OUTPUT
              "release_mode=forced" >> $env:GITHUB_OUTPUT
          }
          else {
              Write-Host "No new files and force_release is false."
              Write-Host "Finishing successfully without modifying the release."
              "publish_release=false" >> $env:GITHUB_OUTPUT
              "release_mode=skipped" >> $env:GITHUB_OUTPUT
          }

          "target_commit=$env:COMMIT_SHA" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------
      # Generate rolling release notes
      #
      # Runs only when one or more new delivery files were committed.
      # ---------------------------------------------------------------
      - name: Generate latest release notes
        if: steps.release_decision.outputs.publish_release == 'true'
        shell: pwsh
        env:
          COMMIT_SHA: ${{ steps.commit_data.outputs.commit_sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $templatePath = $env:RELEASE_TEMPLATE

          if (-not (Test-Path $templatePath -PathType Leaf)) {
              throw "Latest release-note template not found: $templatePath"
          }

          $downloadedFilesPath = Join-Path `
              $env:RUNNER_TEMP `
              "downloaded-files.txt"

          if (-not (Test-Path $downloadedFilesPath -PathType Leaf)) {
              throw "Downloaded-file list not found: $downloadedFilesPath"
          }

          $downloadedFiles = @(
              Get-Content `
                  -Path $downloadedFilesPath |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          $releaseMode = "${{ steps.release_decision.outputs.release_mode }}"

          if ($downloadedFiles.Count -eq 0 -and $releaseMode -ne "forced") {
              throw "No downloaded files were available for release notes."
          }

          $allCsvFiles = @(
              Get-ChildItem `
                  -Path "Day_Delivery" `
                  -Filter "*.csv" `
                  -File `
                  -Recurse
          )

          if ($allCsvFiles.Count -eq 0) {
              throw "No CSV files were found inside Day_Delivery."
          }

          $totalBytes = (
              $allCsvFiles |
              Measure-Object `
                  -Property Length `
                  -Sum
          ).Sum

          $totalSizeMB = [Math]::Round(
              $totalBytes / 1MB,
              2
          )

          $commitSha = $env:COMMIT_SHA.Trim()

          if ([string]::IsNullOrWhiteSpace($commitSha)) {
              throw "The committed source SHA is empty."
          }

          if ($commitSha.Length -ge 7) {
              $shortCommit = $commitSha.Substring(0, 7)
          }
          else {
              $shortCommit = $commitSha
          }

          if ($downloadedFiles.Count -gt 0) {
              $newFileList = (
                  $downloadedFiles |
                  ForEach-Object {
                      "- ``$_``"
                  }
              ) -join [Environment]::NewLine
          }
          else {
              $newFileList = "- No new CSV files; rolling release rebuilt from the current repository state."
          }

          $utcNow = (Get-Date).ToUniversalTime()

          $content = Get-Content `
              -Path $templatePath `
              -Raw

          $replacements = [ordered]@{
              "{{DATE}}"              = $utcNow.ToString("yyyy-MM-dd")
              "{{TIME}}"              = $utcNow.ToString("HH:mm:ss")
              "{{DATETIME}}"          = $utcNow.ToString("yyyy-MM-dd HH:mm:ss")
              "{{NEW_FILE_COUNT}}"    = [string]$downloadedFiles.Count
              "{{SHORT_COMMIT}}"      = $shortCommit
              "{{COMMIT}}"            = $commitSha
              "{{ARCHIVE_NAME}}"      = $env:RELEASE_ZIP
              "{{TOTAL_FILE_COUNT}}"  = [string]$allCsvFiles.Count
              "{{TOTAL_SIZE_MB}}"     = [string]$totalSizeMB
              "{{NEW_FILES}}"         = $newFileList
          }

          foreach ($placeholder in $replacements.Keys) {
              $content = $content.Replace(
                  $placeholder,
                  $replacements[$placeholder]
              )
          }

          Set-Content `
              -Path $env:RELEASE_NOTES `
              -Value $content `
              -Encoding utf8

          if (-not (Test-Path $env:RELEASE_NOTES -PathType Leaf)) {
              throw "Failed to generate $env:RELEASE_NOTES."
          }

          "TOTAL_CSV_FILE_COUNT=$($allCsvFiles.Count)" >> $env:GITHUB_ENV
          "TOTAL_CSV_SIZE_MB=$totalSizeMB" >> $env:GITHUB_ENV

          Write-Host "Generated rolling release notes."
          Write-Host "New files: $($downloadedFiles.Count)"
          Write-Host "Total files: $($allCsvFiles.Count)"
          Write-Host "Total size: $totalSizeMB MB"
          Write-Host "Commit: $shortCommit"

      # ---------------------------------------------------------------
      # Locate and normalize repository license
      # ---------------------------------------------------------------
      - name: Prepare license asset
        if: steps.release_decision.outputs.publish_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $licenseCandidates = @(
              "LICENSE",
              "LICENSE.txt",
              "LICENSE.md"
          )

          $sourceLicense = $licenseCandidates |
              Where-Object {
                  Test-Path `
                      -Path $_ `
                      -PathType Leaf
              } |
              Select-Object -First 1

          if (-not $sourceLicense) {
              throw @"
          No repository license file was found.

          Add one of these files to the repository root:
          - LICENSE
          - LICENSE.txt
          - LICENSE.md
          "@
          }

          $sourceFullPath = (
              Resolve-Path $sourceLicense
          ).Path

          $targetFullPath = Join-Path `
              $PWD.Path `
              $env:RELEASE_LICENSE

          if ($sourceFullPath -ne $targetFullPath) {
              Copy-Item `
                  -Path $sourceLicense `
                  -Destination $env:RELEASE_LICENSE `
                  -Force
          }

          if (-not (Test-Path $env:RELEASE_LICENSE -PathType Leaf)) {
              throw "Failed to prepare the release license."
          }

          Write-Host "Using license file: $sourceLicense"

      # ---------------------------------------------------------------
      # Prepare isolated release package
      #
      # RELEASE_NOTES.md and LICENSE are placed inside the ZIP without
      # modifying the repository's tracked Day_Delivery directory.
      # ---------------------------------------------------------------
      - name: Prepare release package
        if: steps.release_decision.outputs.publish_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "Day_Delivery" -PathType Container)) {
              throw "Day_Delivery folder does not exist."
          }

          if (-not (Test-Path $env:RELEASE_NOTES -PathType Leaf)) {
              throw "Release notes do not exist: $env:RELEASE_NOTES"
          }

          if (-not (Test-Path $env:RELEASE_LICENSE -PathType Leaf)) {
              throw "License does not exist: $env:RELEASE_LICENSE"
          }

          $stagingRoot = Join-Path `
              $env:RUNNER_TEMP `
              "nse-latest-release"

          $stagingFolder = Join-Path `
              $stagingRoot `
              "Day_Delivery"

          if (Test-Path $stagingRoot) {
              Remove-Item `
                  -Path $stagingRoot `
                  -Recurse `
                  -Force
          }

          New-Item `
              -Path $stagingRoot `
              -ItemType Directory `
              -Force |
              Out-Null

          Copy-Item `
              -Path "Day_Delivery" `
              -Destination $stagingRoot `
              -Recurse `
              -Force

          if (-not (Test-Path $stagingFolder -PathType Container)) {
              throw "Failed to create the staged Day_Delivery directory."
          }

          Copy-Item `
              -Path $env:RELEASE_NOTES `
              -Destination (
                  Join-Path `
                      $stagingFolder `
                      "RELEASE_NOTES.md"
              ) `
              -Force

          Copy-Item `
              -Path $env:RELEASE_LICENSE `
              -Destination (
                  Join-Path `
                      $stagingFolder `
                      "LICENSE"
              ) `
              -Force

          "RELEASE_STAGING_ROOT=$stagingRoot" >> $env:GITHUB_ENV
          "RELEASE_STAGING_FOLDER=$stagingFolder" >> $env:GITHUB_ENV

          Write-Host "Release package staging directory prepared."
          Write-Host $stagingFolder

      # ---------------------------------------------------------------
      # Create complete rolling ZIP archive
      # ---------------------------------------------------------------
      - name: Create Day_Delivery ZIP archive
        if: steps.release_decision.outputs.publish_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path $env:RELEASE_ZIP) {
              Remove-Item `
                  -Path $env:RELEASE_ZIP `
                  -Force
          }

          Compress-Archive `
              -Path $env:RELEASE_STAGING_FOLDER `
              -DestinationPath $env:RELEASE_ZIP `
              -CompressionLevel Optimal `
              -Force

          if (-not (Test-Path $env:RELEASE_ZIP -PathType Leaf)) {
              throw "ZIP archive was not created."
          }

          $archive = Get-Item $env:RELEASE_ZIP

          if ($archive.Length -le 0) {
              throw "Generated ZIP archive is empty."
          }

          $archiveSizeMB = [Math]::Round(
              $archive.Length / 1MB,
              2
          )

          "ARCHIVE_SIZE_MB=$archiveSizeMB" >> $env:GITHUB_ENV

          Write-Host "Archive created successfully."
          Write-Host "Archive: $($archive.Name)"
          Write-Host "Size: $archiveSizeMB MB"

      # ---------------------------------------------------------------
      # Generate SHA-256 checksum
      # ---------------------------------------------------------------
      - name: Generate archive checksum
        if: steps.release_decision.outputs.publish_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $checksumFile = "$env:RELEASE_ZIP.sha256"

          $hash = Get-FileHash `
              -Path $env:RELEASE_ZIP `
              -Algorithm SHA256

          $checksumLine = (
              "$($hash.Hash.ToLower())  " +
              $env:RELEASE_ZIP
          )

          Set-Content `
              -Path $checksumFile `
              -Value $checksumLine `
              -Encoding ascii

          if (-not (Test-Path $checksumFile -PathType Leaf)) {
              throw "Checksum file was not created."
          }

          "CHECKSUM_FILE=$checksumFile" >> $env:GITHUB_ENV

          Write-Host $checksumLine

      # ---------------------------------------------------------------
      # Detect whether rolling release already exists
      # ---------------------------------------------------------------
      - name: Detect existing rolling release
        id: release_state
        if: steps.release_decision.outputs.publish_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          # A missing release is expected on the first publication.
          # Do not let PowerShell convert gh exit code 1 into a
          # terminating error before we can inspect $LASTEXITCODE.
          $previousPreference = `
              $PSNativeCommandUseErrorActionPreference

          $PSNativeCommandUseErrorActionPreference = $false

          try {
              & gh release view `
                  $env:RELEASE_TAG `
                  --json tagName `
                  1>$null `
                  2>$null

              $releaseViewExitCode = $LASTEXITCODE
          }
          finally {
              $PSNativeCommandUseErrorActionPreference = `
                  $previousPreference
          }

          if ($releaseViewExitCode -eq 0) {
              Write-Host "Rolling release already exists."
              "release_exists=true" >> $env:GITHUB_OUTPUT
          }
          elseif ($releaseViewExitCode -eq 1) {
              Write-Host "Rolling release does not exist."
              "release_exists=false" >> $env:GITHUB_OUTPUT
          }
          else {
              throw (
                  "Unable to check rolling release state. " +
                  "GitHub CLI exit code: $releaseViewExitCode"
              )
          }

      # ---------------------------------------------------------------
      # Move or create the rolling Git tag
      #
      # The rolling tag always points to the latest committed dataset.
      # ---------------------------------------------------------------
      - name: Update rolling release tag
        if: steps.release_decision.outputs.publish_release == 'true'
        shell: pwsh
        env:
          TARGET_COMMIT: ${{ steps.release_decision.outputs.target_commit }}
        run: |
          $ErrorActionPreference = "Stop"

          $target = $env:TARGET_COMMIT.Trim()

          if ([string]::IsNullOrWhiteSpace($target)) {
              throw "Rolling release target commit is empty."
          }

          git tag `
              --force `
              $env:RELEASE_TAG `
              $target

          if ($LASTEXITCODE -ne 0) {
              throw "Creating or updating the local rolling tag failed."
          }

          git push `
              origin `
              "refs/tags/$env:RELEASE_TAG" `
              --force

          if ($LASTEXITCODE -ne 0) {
              throw "Pushing the rolling release tag failed."
          }

          Write-Host (
              "Rolling tag " +
              $env:RELEASE_TAG +
              " now points to " +
              $target
          )

      # ---------------------------------------------------------------
      # Create rolling release when it does not exist
      # ---------------------------------------------------------------
      - name: Create rolling release
        if: >-
          steps.release_decision.outputs.publish_release == 'true' &&
          steps.release_state.outputs.release_exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          & gh release create `
              $env:RELEASE_TAG `
              "$env:RELEASE_ZIP#Complete NSE delivery data archive" `
              "$env:CHECKSUM_FILE#SHA-256 checksum" `
              "$env:RELEASE_NOTES#Release notes" `
              "$env:RELEASE_LICENSE#License" `
              --title $env:RELEASE_TITLE `
              --notes-file $env:RELEASE_NOTES `
              --verify-tag `
              --latest

          if ($LASTEXITCODE -ne 0) {
              throw "Creating the rolling release failed."
          }

          Write-Host "Rolling release created successfully."

      # ---------------------------------------------------------------
      # Update release metadata when release already exists
      # ---------------------------------------------------------------
      - name: Update rolling release metadata
        if: >-
          steps.release_decision.outputs.publish_release == 'true' &&
          steps.release_state.outputs.release_exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          & gh release edit `
              $env:RELEASE_TAG `
              --title $env:RELEASE_TITLE `
              --notes-file $env:RELEASE_NOTES `
              --latest

          if ($LASTEXITCODE -ne 0) {
              throw "Updating rolling release metadata failed."
          }

          Write-Host "Rolling release metadata updated successfully."

      # ---------------------------------------------------------------
      # Replace existing release assets
      # ---------------------------------------------------------------
      - name: Replace rolling release assets
        if: >-
          steps.release_decision.outputs.publish_release == 'true' &&
          steps.release_state.outputs.release_exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          & gh release upload `
              $env:RELEASE_TAG `
              "$env:RELEASE_ZIP#Complete NSE delivery data archive" `
              "$env:CHECKSUM_FILE#SHA-256 checksum" `
              "$env:RELEASE_NOTES#Release notes" `
              "$env:RELEASE_LICENSE#License" `
              --clobber

          if ($LASTEXITCODE -ne 0) {
              throw "Replacing rolling release assets failed."
          }

          Write-Host "Rolling release assets replaced successfully."

      # ---------------------------------------------------------------
      # Verify release and expected assets
      # ---------------------------------------------------------------
      - name: Verify rolling release
        if: steps.release_decision.outputs.publish_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $releaseJson = gh release view `
              $env:RELEASE_TAG `
              --json `
              tagName,name,isDraft,isPrerelease,assets,url

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to read the published rolling release."
          }

          $release = $releaseJson |
              ConvertFrom-Json

          $expectedAssets = @(
              $env:RELEASE_ZIP
              $env:CHECKSUM_FILE
              $env:RELEASE_NOTES
              $env:RELEASE_LICENSE
          )

          $publishedAssets = @(
              $release.assets |
              ForEach-Object {
                  $_.name
              }
          )

          foreach ($expectedAsset in $expectedAssets) {
              if ($expectedAsset -notin $publishedAssets) {
                  throw (
                      "Expected release asset is missing: " +
                      $expectedAsset
                  )
              }
          }

          "RELEASE_URL=$($release.url)" >> $env:GITHUB_ENV

          Write-Host "Rolling release verification passed."
          Write-Host "Release URL: $($release.url)"
          Write-Host "Published assets:"

          $publishedAssets |
              ForEach-Object {
                  Write-Host " - $_"
              }

      # ---------------------------------------------------------------
      # Workflow summary
      # ---------------------------------------------------------------
      - name: Write workflow summary
        if: always()
        shell: pwsh
        env:
          HAS_CHANGES: ${{ steps.commit_data.outputs.has_changes }}
          FILE_COUNT: ${{ steps.commit_data.outputs.file_count }}
          COMMIT_SHA: ${{ steps.commit_data.outputs.commit_sha }}
          PUBLISH_RELEASE: ${{ steps.release_decision.outputs.publish_release }}
          RELEASE_MODE: ${{ steps.release_decision.outputs.release_mode }}
        run: |
          if ($env:PUBLISH_RELEASE -ne "true") {
              @"
          ## NSE Delivery Data

          No new delivery CSV files were found.

          The workflow completed successfully and the rolling release was not modified.
          To rebuild it manually, run the workflow with **force_release=true**.
          "@ >> $env:GITHUB_STEP_SUMMARY

              exit 0
          }

          $shortSha = $env:COMMIT_SHA

          if ($shortSha.Length -ge 7) {
              $shortSha = $shortSha.Substring(0, 7)
          }

          @"
          ## NSE Delivery Data Published`n`n          - **Release mode:** $env:RELEASE_MODE

          - **New CSV files:** $env:FILE_COUNT
          - **Total CSV files:** $env:TOTAL_CSV_FILE_COUNT
          - **Total CSV size:** $env:TOTAL_CSV_SIZE_MB MB
          - **Commit:** ``$shortSha``
          - **Release tag:** ``$env:RELEASE_TAG``
          - **ZIP asset:** ``$env:RELEASE_ZIP``
          - **Archive size:** $env:ARCHIVE_SIZE_MB MB
          - **Checksum:** ``$env:CHECKSUM_FILE``
          - **Release notes:** ``$env:RELEASE_NOTES``
          - **Release:** $env:RELEASE_URL
          "@ >> $env:GITHUB_STEP_SUMMARY